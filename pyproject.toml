[project]
name = "sdg-align"
version = "0.1.0"
description = "Retrieval-Augmented Generation (RAG) + agent-orchestration pipeline for SDG alignment."
readme = "README.md"
requires-python = ">=3.11"
# Dependencies are intentionally NOT listed here: requirements.txt is the single source of truth
# (this is an application, not an installable library). Keeping one list prevents drift.

[tool.pytest.ini_options]
testpaths = ["tests"]
# Puts the repo root on sys.path so `scripts.*` / `src.*` import under a bare `pytest` as well.
pythonpath = ["."]

[tool.coverage.run]
source = ["scripts", "src"]
branch = true
